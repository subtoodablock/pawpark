<!doctype html><html><body style="margin:0;background:#7fd35b">
<canvas id="c" style="display:block"></canvas>
<script type="module">
import { BREEDS } from '/src/ui/render/breeds.ts';
import { drawDogFrame, drawTail, POSE_FRAMES, DOG_W, DOG_H, DOG_AX, DOG_AY, TAIL_W, TAIL_AX, TAIL_AY, tailAnchor } from '/src/ui/render/dogSprite.ts';
const q = new URLSearchParams(location.search);
const Z = +(q.get('z')||3);
const poses = (q.get('poses')||'walk:0,walk:2,walk:4,run:0,run:2,sit:0,dig:0,dig:1,nap:0,sniff:0').split(',').map(s=>s.split(':'));
const pup = q.get('pup')==='1';
const c = document.getElementById('c');
const dpr = 2;
c.width = poses.length*DOG_W*Z*dpr/1; c.height = BREEDS.length*DOG_H*Z*dpr;
c.style.width = c.width/dpr+'px'; c.style.height=c.height/dpr+'px';
const ctx = c.getContext('2d');
BREEDS.forEach((b,bi)=>{
  poses.forEach(([p,f],pi)=>{
    const off = new OffscreenCanvas(DOG_W*dpr*2, DOG_H*dpr*2); const o = off.getContext('2d'); o.scale(dpr*2,dpr*2);
    const tc = new OffscreenCanvas(TAIL_W*dpr*2, TAIL_W*dpr*2); const t = tc.getContext('2d'); t.scale(dpr*2,dpr*2);
    drawTail(t,b,pup);
    const a = tailAnchor(b,p,+f,pup);
    o.save(); o.translate(a.x,a.y); o.rotate(a.rest + (q.get('wag')?+q.get('wag'):0)); o.drawImage(tc,-TAIL_AX,-TAIL_AY,TAIL_W,TAIL_W); o.restore();
    drawDogFrame(o,b,p,+f,pup);
    ctx.drawImage(off, pi*DOG_W*Z*dpr, bi*DOG_H*Z*dpr, DOG_W*Z*dpr, DOG_H*Z*dpr);
  });
});
window.done = true;
</script></body></html>
